<script>(function(){var w=document.getElementById("fabWrap"),b=document.getElementById("fabBtn");if(w&&b){b.addEventListener("click",function(e){e.stopPropagation();var o=w.classList.toggle("open");b.setAttribute("aria-expanded",o);});document.addEventListener("click",function(e){if(!w.contains(e.target)){w.classList.remove("open");b.setAttribute("aria-expanded","false");}});}})();</script>
<script>
const nav=document.getElementById('nav');
const onScroll=()=>nav.classList.toggle('scrolled', window.scrollY>40); onScroll(); window.addEventListener('scroll',onScroll);
const burger=document.getElementById('burger'), navLinks=document.getElementById('navLinks');
burger.addEventListener('click',()=>navLinks.classList.toggle('open'));
const dp=document.querySelector('.has-dropdown'), dt=dp?dp.querySelector('.dropdown-trigger'):null;
if(dt){dt.addEventListener('click',e=>{ if(window.matchMedia('(max-width:1080px)').matches){e.preventDefault();e.stopPropagation();dp.classList.toggle('open-sub');}});}
navLinks.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{ if(a.classList.contains('dropdown-trigger')&&window.matchMedia('(max-width:1080px)').matches)return;
  navLinks.classList.remove('open'); if(dp)dp.classList.remove('open-sub'); }));
const langToggle=document.getElementById('langToggle'), langMenu=document.getElementById('langMenu'),
  langCurrent=document.getElementById('langCurrent'), langOriginal=langCurrent.textContent;
langToggle.addEventListener('click',e=>{e.stopPropagation();langMenu.classList.toggle('open');});
langMenu.querySelectorAll('a').forEach(a=>{ a.addEventListener('mouseenter',()=>langCurrent.textContent=a.dataset.lang);
  a.addEventListener('mouseleave',()=>langCurrent.textContent=langOriginal); a.addEventListener('click',()=>langCurrent.textContent=a.dataset.lang); });
</script>
